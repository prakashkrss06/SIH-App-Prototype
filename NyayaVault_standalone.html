<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
  <title>NyayaVault - Secure Digital Evidence Platform</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html,
    body {
      min-height: 100vh;
      background: #e9e4d3;
      font-family: ui-sans-serif, -apple-system, "Segoe UI", sans-serif
    }

    #root {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px
    }

    h1,
    h2,
    h3 {
      font-family: Georgia, "Times New Roman", serif
    }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace
    }

    .muted {
      color: #6B6759
    }

    .small {
      font-size: 12px
    }

    .red {
      color: #B3261E
    }

    .green {
      color: #2F7D4F
    }

    /* Login */
    .login {
      min-height: 640px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 30% 20%, #16264A 0%, #0F1B33 60%);
      padding: 40px 16px;
      border-radius: 14px
    }

    .login-card {
      background: #FCFAF4;
      border-radius: 14px;
      padding: 32px 30px;
      width: 380px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, .35);
      text-align: center
    }

    .seal {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #E7C878, #A9822E);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      margin: 0 auto 12px;
      box-shadow: 0 0 0 3px #F7F4EC, 0 0 0 4px #C9A24B
    }

    .seal.sm {
      width: 32px;
      height: 32px;
      font-size: 16px;
      margin: 0
    }

    .login-card h1 {
      font-size: 26px;
      color: #0F1B33
    }

    .tagline {
      color: #8A8570;
      font-style: italic;
      margin: 4px 0 20px;
      font-size: 13px
    }

    .login-card form {
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 12px
    }

    label {
      font-size: 12px;
      color: #5B584F;
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-weight: 600
    }

    input,
    select {
      font-family: inherit;
      font-size: 14px;
      padding: 9px 10px;
      border-radius: 8px;
      border: 1px solid #DDD6C1;
      background: #fff;
      color: #1B1A17;
      width: 100%
    }

    input:focus,
    select:focus {
      outline: 2px solid #C9A24B;
      outline-offset: 1px
    }

    .hint {
      font-size: 11px;
      color: #9A9580;
      margin-top: 14px
    }

    .form-error {
      color: #B3261E;
      font-size: 12.5px;
      background: #FBEAE9;
      padding: 8px 10px;
      border-radius: 6px
    }

    .form-warn {
      color: #A15C00;
      font-size: 12.5px;
      background: #FFF7EA;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #E3B26B
    }

    .form-info {
      color: #16264A;
      font-size: 12.5px;
      background: #EEF3FB;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #B0C4E8
    }

    /* Password strength */
    .pw-strength {
      height: 4px;
      border-radius: 2px;
      margin-top: 4px;
      transition: all .3s
    }

    .pw-weak {
      background: #B3261E;
      width: 33%
    }

    .pw-medium {
      background: #E3B26B;
      width: 66%
    }

    .pw-strong {
      background: #2F7D4F;
      width: 100%
    }

    .pw-label {
      font-size: 10px;
      margin-top: 2px
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      justify-content: center;
      border: none;
      border-radius: 8px;
      padding: 9px 16px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: transform .05s, filter .15s
    }

    .btn:active {
      transform: translateY(1px)
    }

    .btn:disabled {
      opacity: .45;
      cursor: not-allowed
    }

    .btn-gold {
      background: linear-gradient(180deg, #D8B45E, #B98F32);
      color: #1B1A17
    }

    .btn-gold:hover:not(:disabled) {
      filter: brightness(1.05)
    }

    .btn-outline {
      background: #fff;
      color: #16264A;
      border: 1px solid #D8D2BC
    }

    .btn-outline:hover {
      background: #F3F0E5
    }

    .btn-warn {
      background: #fff;
      color: #A15C00;
      border: 1px dashed #E3B26B
    }

    .btn-warn:hover {
      background: #FFF7EA
    }

    .btn-danger {
      background: #B3261E;
      color: #fff;
      border: none
    }

    .btn-danger:hover {
      filter: brightness(1.1)
    }

    .btn-green {
      background: #2F7D4F;
      color: #fff;
      border: none
    }

    .link-btn {
      background: none;
      border: none;
      color: #C9A24B;
      font-size: 12.5px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      padding: 6px 0;
      font-family: inherit
    }

    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #6B6759;
      padding: 4px;
      border-radius: 5px
    }

    .icon-btn:hover {
      background: #EFEBDD
    }

    /* Layout */
    .layout {
      display: flex;
      min-height: 640px;
      background: #F7F4EC;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 1px 0 #E4DFD0
    }

    .sidebar {
      width: 230px;
      background: #0F1B33;
      color: #E9E6DA;
      display: flex;
      flex-direction: column;
      padding: 18px 14px;
      flex-shrink: 0
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 4px 4px 18px;
      border-bottom: 1px solid rgba(255, 255, 255, .1);
      margin-bottom: 14px
    }

    .brand-name {
      font-family: Georgia, serif;
      font-size: 15px;
      font-weight: 700;
      color: #F3EFE2
    }

    .brand-tag {
      font-size: 10.5px;
      color: #9AA6C4
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      background: none;
      border: none;
      color: #C7CCE0;
      padding: 9px 10px;
      border-radius: 8px;
      font-size: 13.5px;
      cursor: pointer;
      text-align: left;
      font-family: inherit;
      margin-bottom: 2px
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, .06)
    }

    .nav-item.active {
      background: rgba(201, 162, 75, .16);
      color: #F3EFE2
    }

    .badge {
      margin-left: auto;
      background: #B3261E;
      color: #fff;
      border-radius: 10px;
      padding: 1px 7px;
      font-size: 10.5px;
      font-weight: 700
    }

    .sidebar-footer {
      margin-top: auto;
      padding-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, .1)
    }

    .user-chip {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 8px
    }

    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #2A3B63;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: #E9E6DA;
      flex-shrink: 0
    }

    .user-name {
      font-size: 12.5px;
      color: #F3EFE2;
      font-weight: 600
    }

    .user-role {
      font-size: 11px;
      color: #93A0C4
    }

    .sidebar-footer .link-btn {
      color: #C7CCE0
    }

    .session-bar {
      background: rgba(255, 255, 255, .07);
      border-radius: 6px;
      padding: 6px 8px;
      margin-bottom: 8px;
      font-size: 11px;
      color: #C7CCE0
    }

    .session-bar.warn {
      background: rgba(179, 38, 30, .2);
      color: #F4B8B5
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 22px;
      border-bottom: 1px solid #E4DFD0;
      background: #FCFAF4
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #F1EDE0;
      border-radius: 8px;
      padding: 7px 12px;
      width: 340px;
      color: #6B6759
    }

    .search-box input {
      border: none;
      background: none;
      outline: none;
      font-size: 13.5px;
      width: 100%
    }

    .topbar-role {
      font-size: 12.5px;
      color: #6B6759
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 16px
    }

    .page {
      padding: 22px 26px 34px;
      overflow-y: auto;
      flex: 1
    }

    .page-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 18px;
      gap: 12px;
      flex-wrap: wrap
    }

    .page-head h2 {
      font-size: 21px;
      color: #0F1B33
    }

    .back-btn {
      background: none;
      border: none;
      color: #6B6759;
      font-size: 12.5px;
      cursor: pointer;
      margin-bottom: 10px;
      padding: 0;
      font-family: inherit
    }

    .section-title {
      font-size: 14px;
      color: #16264A;
      margin: 24px 0 10px;
      font-family: Georgia, serif
    }

    .page-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap
    }

    /* Stats */
    .stat-row {
      display: flex;
      gap: 14px;
      margin-bottom: 6px;
      flex-wrap: wrap
    }

    .stat-card {
      flex: 1;
      min-width: 120px;
      background: #fff;
      border: 1px solid #E4DFD0;
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      color: #16264A
    }

    .stat-card.alert {
      border-color: #E9B7B2;
      background: #FBEAE9;
      color: #8A241C
    }

    .stat-value {
      font-size: 20px;
      font-weight: 700;
      font-family: Georgia, serif
    }

    .stat-label {
      font-size: 11.5px;
      color: #6B6759
    }

    /* Cases & Docs */
    .case-list,
    .doc-list {
      display: flex;
      flex-direction: column;
      gap: 8px
    }

    .case-row {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #fff;
      border: 1px solid #E4DFD0;
      border-radius: 10px;
      padding: 12px 14px;
      cursor: pointer;
      text-align: left;
      font-family: inherit;
      width: 100%
    }

    .case-row:hover {
      border-color: #C9A24B;
      background: #FFFDF7
    }

    .case-icon {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: #F1EDE0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0
    }

    .case-info {
      flex: 1;
      min-width: 0
    }

    .case-title {
      font-weight: 600;
      font-size: 14px;
      color: #1B1A17
    }

    .sealed-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 20px;
      background: #EEF3FB;
      color: #16264A;
      border: 1px solid #B0C4E8;
      margin-left: 8px
    }

    .doc-card {
      background: #fff;
      border: 1px solid #E4DFD0;
      border-radius: 10px;
      overflow: hidden
    }

    .doc-head {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      background: none;
      border: none;
      padding: 12px 14px;
      cursor: pointer;
      text-align: left;
      font-family: inherit
    }

    .doc-name {
      flex: 1
    }

    .doc-name>div:first-child {
      font-weight: 600;
      font-size: 13.5px
    }

    .doc-body {
      padding: 4px 16px 16px;
      border-top: 1px solid #EEEADE
    }

    .hash-row {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #F1EDE0;
      border-radius: 7px;
      padding: 8px 10px;
      margin-bottom: 12px;
      font-size: 12.5px;
      color: #16264A;
      flex-wrap: wrap
    }

    .doc-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px
    }

    .share-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #FFF7EA;
      border: 1px dashed #E3B26B;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12.5px;
      flex-wrap: wrap
    }

    .versions {
      background: #FAF8F0;
      border-radius: 8px;
      padding: 8px 10px;
      margin-top: 8px
    }

    .version-row {
      display: flex;
      justify-content: space-between;
      padding: 3px 0;
      font-size: 12px
    }

    /* Share links table */
    .share-links-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
      margin-top: 6px
    }

    .share-links-table th {
      background: #F1EDE0;
      padding: 7px 10px;
      text-align: left;
      color: #6B6759;
      font-size: 11.5px
    }

    .share-links-table td {
      padding: 7px 10px;
      border-top: 1px solid #EFEBDD
    }

    .share-links-table tr:hover td {
      background: #FAFAF5
    }

    /* Pills */
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 20px
    }

    .pill-ok {
      background: #EAF4EE;
      color: #2F7D4F
    }

    .pill-alert {
      background: #FBEAE9;
      color: #B3261E
    }

    .pill-info {
      background: #EEF3FB;
      color: #16264A
    }

    .pill-warn {
      background: #FFF7EA;
      color: #A15C00
    }

    /* Audit table */
    .table {
      border: 1px solid #E4DFD0;
      border-radius: 10px;
      overflow: hidden;
      background: #fff
    }

    .table-head,
    .table-row {
      display: grid;
      grid-template-columns: 1.6fr 1fr 1.3fr 1.2fr;
      gap: 10px;
      padding: 10px 14px;
      align-items: center
    }

    .table-head {
      background: #F1EDE0;
      font-size: 11.5px;
      color: #6B6759;
      font-weight: 700
    }

    .table-row {
      border-top: 1px solid #EFEBDD;
      font-size: 12.5px
    }

    .table-row.row-alert {
      background: #FBEAE9
    }

    .alert-card {
      display: flex;
      gap: 12px;
      background: #fff;
      border: 1px solid #E9B7B2;
      border-radius: 10px;
      padding: 12px 14px;
      align-items: center
    }

    /* Empty */
    .empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: #9A9580;
      padding: 40px 20px;
      text-align: center;
      font-size: 14px
    }

    .empty.ok {
      color: #2F7D4F
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 27, 51, .55);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50
    }

    .modal {
      background: #FCFAF4;
      border-radius: 12px;
      padding: 20px 22px;
      width: 400px;
      max-width: 95vw;
      box-shadow: 0 24px 60px rgba(0, 0, 0, .35);
      max-height: 90vh;
      overflow-y: auto
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px
    }

    .modal-head h3 {
      font-size: 16px;
      color: #0F1B33
    }

    .form {
      display: flex;
      flex-direction: column;
      gap: 12px
    }

    .share-success {
      display: flex;
      gap: 10px;
      align-items: center;
      background: #EAF4EE;
      border-radius: 8px;
      padding: 10px;
      font-size: 13px
    }

    /* TOTP / MFA screen — premium redesign */
    .mfa-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at 20% 10%, #1a3260 0%, #0a1220 55%, #0d1f3c 100%);
      padding: 24px 16px
    }

    .mfa-card {
      background: #FCFAF4;
      border-radius: 20px;
      padding: 36px 32px 32px;
      width: 420px;
      box-shadow: 0 32px 80px rgba(0,0,0,.45), 0 0 0 1px rgba(201,162,75,.25);
      text-align: center;
      position: relative;
      overflow: hidden
    }

    .mfa-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, #D8B45E, #C9A24B, #B98F32)
    }

    .mfa-icon-ring {
      width: 72px;
      height: 72px;
      margin: 0 auto 16px;
      position: relative
    }

    .mfa-icon-ring svg {
      position: absolute;
      top: 0; left: 0;
      transform: rotate(-90deg)
    }

    .mfa-icon-ring .ring-bg {
      fill: none;
      stroke: #E4DFD0;
      stroke-width: 4
    }

    .mfa-icon-ring .ring-fill {
      fill: none;
      stroke: #D8B45E;
      stroke-width: 4;
      stroke-linecap: round;
      stroke-dasharray: 201.06;
      transition: stroke-dashoffset 1s linear
    }

    .mfa-icon-inner {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px
    }

    .mfa-title {
      font-family: Georgia, serif;
      font-size: 22px;
      color: #0F1B33;
      margin-bottom: 4px
    }

    .mfa-subtitle {
      font-size: 13px;
      color: #8A8570;
      margin-bottom: 20px;
      font-style: italic
    }

    /* Steps indicator */
    .mfa-steps {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0;
      margin-bottom: 22px
    }

    .mfa-step {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px
    }

    .mfa-step-dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #E4DFD0;
      color: #9A9580;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .3s
    }

    .mfa-step-dot.active {
      background: linear-gradient(180deg, #D8B45E, #B98F32);
      color: #1B1A17;
      box-shadow: 0 0 0 3px rgba(201,162,75,.25)
    }

    .mfa-step-dot.done {
      background: #2F7D4F;
      color: #fff
    }

    .mfa-step-label {
      font-size: 10px;
      color: #9A9580;
      font-weight: 600
    }

    .mfa-step-label.active { color: #B98F32 }
    .mfa-step-label.done   { color: #2F7D4F }

    .mfa-step-line {
      width: 40px;
      height: 2px;
      background: #E4DFD0;
      margin-bottom: 16px
    }

    .mfa-step-line.done { background: #2F7D4F }

    /* TOTP code display */
    .totp-box {
      background: linear-gradient(135deg, #0F1B33 0%, #16264A 100%);
      color: #F3EFE2;
      border-radius: 14px;
      padding: 20px 24px;
      text-align: center;
      margin: 0 0 16px;
      border: 1px solid rgba(201,162,75,.2);
      position: relative;
      overflow: hidden
    }

    .totp-box::after {
      content: '';
      position: absolute;
      top: -40px; right: -40px;
      width: 120px; height: 120px;
      border-radius: 50%;
      background: rgba(216,180,94,.06)
    }

    .totp-label {
      font-size: 10.5px;
      color: #9AA6C4;
      letter-spacing: .5px;
      text-transform: uppercase;
      margin-bottom: 10px
    }

    .totp-code {
      font-family: ui-monospace, monospace;
      font-size: 40px;
      font-weight: 700;
      letter-spacing: 10px;
      color: #D8B45E;
      text-shadow: 0 0 20px rgba(216,180,94,.35);
      padding-left: 10px
    }

    .totp-timer {
      font-size: 11px;
      color: #9AA6C4;
      margin-top: 8px
    }

    .totp-progress {
      height: 3px;

    async function sha256Hex(buffer) {

      return h1.toString(16).padStart(8, '0') + h2.toString(16).padStart(8, '0') + h1.toString(16).padStart(8, '0') + h2.toString(16).padStart(8, '0');
    }

    function textToBuf(t) { return new TextEncoder().encode(t).buffer; }
    function bufToBase64(buf) {

      for (let i = 0; i < bytes.length; i += c) s += String.fromCharCode.apply(null, bytes.subarray(i, i + c));

    function stepUpVerifyPassword() {
      if (A.stepUpPassword !== A.user.password) {
        set({ stepUpError: 'Incorrect password. Please try again.' });
        return;
      }
      set({ stepUpStep: 2, stepUpError: '' });
    }

    async function stepUpVerifyFingerprint() {
      set({ stepUpFpState: 'scanning', stepUpError: '' });

      // Try real WebAuthn platform biometric first
      let usedReal = false;
      try {
        const available = await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
        if (available) {
          // Build a minimal get() assertion to trigger biometric prompt
          await navigator.credentials.get({
            publicKey: {
              challenge: crypto.getRandomValues(new Uint8Array(32)),
              timeout: 30000,
              userVerification: 'required',
              allowCredentials: [],  // empty = any credential → triggers biometric
            }
          });
          usedReal = true;
        }
      } catch (e) {
        // NotAllowedError = user cancelled, other = no credential registered → fall to simulation
        if (e && e.name === 'NotAllowedError') {
          set({ stepUpFpState: 'fail', stepUpError: 'Biometric verification cancelled. Please try again.' });
          return;
        }
        // No registered credential → fall through to simulated scan
      }

      if (!usedReal) {
        // Simulated biometric: 2-second scan delay
        await new Promise(r => setTimeout(r, 2000));
      }

      // Success — run the callback action
      set({ stepUpFpState: 'success', stepUpError: '' });
      await new Promise(r => setTimeout(r, 600)); // brief success flash
      const cb = A.stepUpCallback;
      set({ showStepUp: false, stepUpPassword: '', stepUpFpState: 'idle', stepUpCallback: null });
      if (cb) cb();
    }

    // Generate a new math captcha and store it in state
    function refreshCaptcha() {
      const ops = ['+', '-', '×'];
      const op = ops[Math.floor(Math.random() * 3)];
      const a = Math.floor(Math.random() * 9) + 1;
      const b = op === '-' ? Math.floor(Math.random() * a) + 1 : Math.floor(Math.random() * 9) + 1;
      set({ captchaQ: { a, b, op }, captchaInput: '', captchaAnswer: '', captchaError: '' });
    }

    function captchaExpected(q) {
      if (q.op === '+') return q.a + q.b;
      if (q.op === '-') return q.a - q.b;
      if (q.op === '×') return q.a * q.b;
    }

    async function verifyMFA() {
      const found = A.awaitingMFA;

      // Step 1: Validate CAPTCHA
      const expected = captchaExpected(A.captchaQ);
      if (parseInt(A.captchaInput, 10) !== expected) {
        refreshCaptcha();
        set({ captchaError: 'Incorrect answer. Please solve the new puzzle.' });
        return;
      }

      // Step 2: Validate TOTP (±1 window tolerance per RFC 6238)
      const nowEpoch = Math.floor(Date.now() / 1000);
      const currentCounter = Math.floor(nowEpoch / 30);
      const codes = await Promise.all([
        generateTOTPForCounter(found.totpSecret, currentCounter),
        generateTOTPForCounter(found.totpSecret, currentCounter - 1),
      ]);
      if (!codes.includes(A.totpInput.trim())) {
        set({ totpError: 'Invalid OTP. Please try again.' });
        return;
      }

      if (A.totpInterval) { clearInterval(A.totpInterval); }
      A.sessionSalt = found.username + '_salt_v1';
      A.sessionPassword = found.password;
      set({ user: found, awaitingMFA: null, totpInterval: null, screen: 'dashboard',
            captchaAnswer: '', captchaInput: '', captchaError: '' });
      startSessionTimers();
      notify('success', `Welcome, ${found.name}!`);
    }

      clearSessionTimers();

    async function uploadDocument(caseId, file, docType) {
      // File type validation
      const ext = '.' + file.name.split('.').pop().toLowerCase();
      if (BLOCKED_EXTS.includes(ext)) {
        set({ uploadError: `File type "${ext}" is not allowed for security reasons.` });
        return;
      }
      // File size limit
      if (file.size > MAX_FILE_MB * 1024 * 1024) {
        set({ uploadError: `File exceeds ${MAX_FILE_MB}MB limit. Size: ${(file.size / 1024 / 1024).toFixed(1)}MB` });
        return;
      }
      const buf = await file.arrayBuffer();
      const hash = await sha256Hex(buf);
      // Duplicate detection
      const dup = A.documents.find(d => d.hash === hash && d.caseId !== caseId);
      if (dup) {
        notify('warn', `⚠️ Same file already exists in case ${dup.caseId} as "${dup.name}".`);
      }
      const plainB64 = bufToBase64(buf);
      const encB64 = await aesEncrypt(plainB64, A.sessionPassword, A.sessionSalt);
      const existing = A.documents.find(d => d.caseId === caseId && d.name === file.name);
      if (existing) {
        A.documents = A.documents.map(d => d.id === existing.id
          ? {
            ...d, hash, encContent: encB64, size: file.size,
            versions: [...d.versions, { hash: d.hash, at: d.uploadedAt, by: d.uploadedBy }],
            uploadedAt: new Date().toISOString(), uploadedBy: A.user.username
          }
          : d);
        await addAuditLog({ docId: existing.id, caseId, action: 'NEW_VERSION_UPLOADED' });
        notify('success', `New version of "${file.name}" recorded & encrypted.`);
      } else {
        const id = genId('DOC');
        A.documents = [...A.documents, { id, caseId, name: file.name, docType, hash, encContent: encB64, size: file.size, uploadedBy: A.user.username, uploadedAt: new Date().toISOString(), versions: [] }];
        await addAuditLog({ docId: id, caseId, action: 'UPLOADED' });
        notify('success', `"${file.name}" uploaded, encrypted & fingerprinted.`);
      }
      set({ showUpload: false, uploadFile: null, uploadError: '' });
    }

    async function getDocumentBytes(doc) {
      const plainB64 = await aesDecrypt(doc.encContent, A.sessionPassword, A.sessionSalt);
      return base64ToBuf(plainB64);
    }

    async function verifyDocument(doc) {
      const buf = await getDocumentBytes(doc);
      const currentHash = await sha256Hex(buf);
      const match = currentHash === doc.hash;
      await addAuditLog({ docId: doc.id, caseId: doc.caseId, action: match ? 'INTEGRITY_VERIFIED' : 'TAMPER_ALERT' });
      notify(match ? 'success' : 'error', match ? '✅ Integrity verified — hash matches record' : '⚠️ Tampering detected — hash mismatch!');
      A.verifyStates = { ...A.verifyStates, [doc.id]: match ? 'ok' : 'mismatch' };
      render();
    }

    function simulateTamper(doc) {
      try {
        // We'll just modify the hash to simulate tampering detection without decrypting
        A.documents = A.documents.map(d => d.id === doc.id ? { ...d, hash: d.hash.replace(/.$/, d.hash.slice(-1) === 'a' ? 'b' : 'a') } : d);
        notify('warn', 'Demo: file fingerprint altered. Click Verify Integrity to detect tampering.');
        render();
      } catch (e) { }
    }

    async function downloadDocument(doc) {
      const buf = await getDocumentBytes(doc);
      // Watermark: create a watermark text file alongside
      const watermark = `=== NYAYAVAULT SECURE DOWNLOAD WATERMARK ===
Document:  ${doc.name}
Case ID:   ${doc.caseId}
Downloaded by: ${A.user.name} (${A.user.username})
Role:      ${A.user.role}
Timestamp: ${new Date().toISOString()}
SHA-256:   ${doc.hash}
============================================
This download is logged and audited.
Unauthorized use or distribution is prohibited.`;
      const wmBlob = new Blob([watermark], { type: 'text/plain' });
      const wmUrl = URL.createObjectURL(wmBlob);
      const wmA = document.createElement('a');
      wmA.href = wmUrl; wmA.download = doc.name + '_WATERMARK.txt'; wmA.click();
      URL.revokeObjectURL(wmUrl);
      // Download actual file
      const blob = new Blob([buf]);
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = doc.name; a.click();
      URL.revokeObjectURL(url);
      await addAuditLog({ docId: doc.id, caseId: doc.caseId, action: 'DOWNLOADED' });
      notify('success', 'Download started. Watermark certificate saved.');
    }

    async function createShareLink(doc, expiryMs) {
      const token = (crypto.getRandomValues(new Uint8Array(5))).reduce((s, b) => s + b.toString(36).padStart(2, '0'), '').toUpperCase().slice(0, 8);
      const expiresAt = Date.now() + expiryMs;
      A.shareLinks = [...A.shareLinks, { token, docId: doc.id, caseId: doc.caseId, createdBy: A.user.username, createdAt: Date.now(), expiresAt, used: false, revoked: false }];
      await addAuditLog({ docId: doc.id, caseId: doc.caseId, action: 'SHARE_LINK_CREATED' });
      render();
      return token;
    }

    async function revokeShareLink(token) {
      A.shareLinks = A.shareLinks.map(l => l.token === token ? { ...l, revoked: true } : l);
      await addAuditLog({ action: 'SHARE_LINK_REVOKED' });
      notify('success', 'Share link revoked successfully.');
      render();
    }

    async function redeemShareToken(token) {
      const link = A.shareLinks.find(l => l.token === token.trim().toUpperCase());
      if (!link) return { ok: false, msg: 'Invalid code. Check and try again.' };
      if (link.revoked) return { ok: false, msg: 'This link has been revoked by the issuer.' };
      if (link.used) return { ok: false, msg: 'This is a one-time link and has already been used.' };
      if (Date.now() > link.expiresAt) return { ok: false, msg: 'This link has expired.' };
      const doc = A.documents.find(d => d.id === link.docId);
      // Mark as used (one-time link)
      A.shareLinks = A.shareLinks.map(l => l.token === token.trim().toUpperCase() ? { ...l, used: true } : l);
      await addAuditLog({ docId: doc.id, caseId: doc.caseId, action: 'ACCESSED_VIA_SHARE_LINK' });
      return { ok: true, doc };
    }

          ),

          /* ── Actions ── */

        )
      );

    /* ── Sidebar ── */
    function buildSidebar() {
      const { user, screen, auditLogs, sessionCountdown, sessionShowWarn } = A;
      const alertCount = auditLogs.filter(l => l.action === 'TAMPER_ALERT').length;
      const items = [
        { key: 'dashboard', label: 'Dashboard', icon: '📊', roles: ['Investigating Officer', 'Senior Officer', 'Audit Authority'] },
        { key: 'audit', label: 'Audit Trail', icon: '🕓', roles: ['Senior Officer', 'Audit Authority'] },
        { key: 'alerts', label: 'Security Alerts', icon: '🚨', roles: ['Audit Authority', 'Senior Officer'], badge: alertCount },
      ];
      const initials = user.name.split(' ').map(w => w[0]).slice(0, 2).join('');
      const secsIdle = Math.max(0, Math.round(SESSION_MS / 1000 - (Date.now() - A.lastActivity) / 1000));
      const showTimer = secsIdle < 60;

      return el('aside', { class: 'sidebar' },
        el('div', { class: 'brand' },
          el('div', { class: 'seal sm' }, '🛡️'),
          el('div', {}, el('div', { class: 'brand-name' }, 'NyayaVault'), el('div', { class: 'brand-tag' }, 'Secure · Traceable'))
        ),
        el('nav', {}, ...items.filter(i => i.roles.includes(user.role)).map(i =>
          el('button', { class: `nav-item${screen === i.key ? ' active' : ''}`, onClick: () => set({ screen: i.key }) },

            i.badge ? el('span', { class: 'badge' }, i.badge) : null
          )
        )),
        el('div', { class: 'sidebar-footer' },
          sessionShowWarn
            ? el('div', { class: 'session-bar warn' }, `⚠️ Session expires in ${sessionCountdown}s`)
            : showTimer ? el('div', { class: 'session-bar' }, `⏱️ Idle timeout in ${secsIdle}s`) : null,
          el('div', { class: 'user-chip' },
            el('div', { class: 'avatar' }, initials),
            el('div', {}, el('div', { class: 'user-name' }, user.name), el('div', { class: 'user-role' }, user.role))
          ),
          el('button', { class: 'link-btn', onClick: doLogout }, '🚪 Sign out')
        )
      );
    }

    /* ── TopBar ── */
    function buildTopBar() {
      const si = el('input', { placeholder: 'Search cases, documents, IDs…', value: A.searchQuery, id: 'topbar-search' });
      // Direct DOM update on search - no full render() so input never loses focus
      let searchDebounce = null;
      si.addEventListener('input', e => {
        A.searchQuery = e.target.value;
        clearTimeout(searchDebounce);
        searchDebounce = setTimeout(() => {
          const area = document.getElementById('main-content-area');
          if (!area) { render(); return; }
          let newContent;
          if (A.searchQuery.trim()) newContent = buildSearch();
          else if (A.screen === 'dashboard') newContent = buildDashboard();
          else if (A.screen === 'audit') newContent = buildGlobalAudit();
          else if (A.screen === 'alerts') newContent = buildAlertsPanel();
          else if (A.screen === 'case' && A.selectedCaseId) newContent = buildCaseDetail();
          else newContent = buildEmpty('Select a case from the dashboard to continue.');
          area.innerHTML = '';
          area.appendChild(newContent);
        }, 150);
      });
      return el('div', { class: 'topbar' },
        el('div', { class: 'search-box' }, el('span', {}, '🔍'), si),
        el('div', { class: 'topbar-right' },
          el('button', { class: 'link-btn', onClick: () => set({ showRedeem: true }) }, '🔗 Redeem share code'),
          el('div', { class: 'topbar-role' }, 'Signed in as ', el('strong', {}, A.user.role))
        )
      );
    }

    /* ── Dashboard ── */
    function buildDashboard() {
      const { user, cases, documents, auditLogs } = A;
      const canCreate = user.role === 'Investigating Officer';
      const alertCount = auditLogs.filter(l => l.action === 'TAMPER_ALERT').length;
      return el('div', { class: 'page' },
        el('div', { class: 'page-head' },
          el('div', {},
            el('h2', {}, 'Case Dashboard'),
            el('p', { class: 'muted', style: { marginTop: '4px' } }, `${cases.length} case${cases.length !== 1 ? 's' : ''} · ${documents.length} document${documents.length !== 1 ? 's' : ''} on record`)
          ),
          canCreate ? el('button', { class: 'btn btn-gold', onClick: () => startStepUp(() => set({ showNewCase: true })) }, '➕ New case') : null
        ),
        el('div', { class: 'security-badges' },
          el('span', { class: 'pill pill-ok' }, '🔒 AES-256 Encrypted'),
          el('span', { class: 'pill pill-info' }, '🔑 TOTP MFA Active'),
          el('span', { class: 'pill pill-info' }, '⏱️ Session Timeout On'),
          el('span', { class: 'pill pill-ok' }, '📋 Audit Chain Active'),
          el('span', { class: 'pill pill-warn' }, '👆 Step-Up Auth On'),
        ),
        el('div', { class: 'stat-row' },
          statCard('🗂️', 'Open cases', cases.length),
          statCard('📄', 'Documents secured', documents.length),
          statCard('🚨', 'Tamper alerts', alertCount, alertCount ? 'alert' : 'ok'),
          statCard('🔗', 'Active share links', A.shareLinks.filter(l => !l.revoked && !l.used && Date.now() < l.expiresAt).length),
        ),
        el('h3', { class: 'section-title' }, 'Cases'),
        cases.length === 0 ? buildEmpty('No cases yet. Open one to start a secure workspace.')
          : el('div', { class: 'case-list' }, ...cases.map(c => {
            const dc = documents.filter(d => d.caseId === c.id).length;
            return el('button', { class: 'case-row', onClick: () => set({ selectedCaseId: c.id, screen: 'case' }) },
              el('div', { class: 'case-icon' }, '🗂️'),
              el('div', { class: 'case-info' },
                el('div', { class: 'case-title' }, c.title, c.sealed ? el('span', { class: 'sealed-badge' }, '🔒 Sealed') : null),
                el('div', { class: 'muted small' }, `${c.id} · ${c.type} · opened ${fmtDate(c.createdAt)}`)
              ),
              el('div', { class: 'muted small' }, `${dc} doc${dc !== 1 ? 's' : ''}`),
              el('span', { class: 'chevron' }, '›')
            );
          }))
      );

    function statCard(icon, label, value, tone) {
      return el('div', { class: `stat-card${tone === 'alert' ? ' alert' : ''}` },
        el('span', { style: { fontSize: '20px' } }, icon),
        el('div', {}, el('div', { class: 'stat-value' }, value), el('div', { class: 'stat-label' }, label))
      );
    }

    /* ── Doc row ── */
    function buildDocRow(doc) {
      const { expandedDoc, verifyStates, user } = A;
      const expanded = expandedDoc === doc.id;
      const vs = verifyStates[doc.id];
      const canShare = user.role !== 'Audit Authority';
      const docLinks = A.shareLinks.filter(l => l.docId === doc.id);
      const activeLinks = docLinks.filter(l => !l.revoked && !l.used && Date.now() < l.expiresAt);

      const pill = vs === 'ok' ? el('span', { class: 'pill pill-ok' }, '✅ Verified')
        : vs === 'mismatch' ? el('span', { class: 'pill pill-alert' }, '⚠️ Mismatch') : null;

      const head = el('button', { class: 'doc-head', onClick: () => set({ expandedDoc: expanded ? null : doc.id }) },
        el('span', { style: { fontSize: '17px' } }, '📄'),
        el('div', { class: 'doc-name' },
          el('div', {}, doc.name),
          el('div', { class: 'muted small' }, `${doc.docType} · ${fmtDate(doc.uploadedAt)} · by ${doc.uploadedBy}${doc.versions.length ? ` · v${doc.versions.length + 1}` : ''}`)
        ),
        el('span', { class: 'pill pill-info', style: { fontSize: '10px' } }, '🔒 AES-256'),
        pill,
        el('span', { class: `chevron${expanded ? ' open' : ''}` }, '›')
      );
      if (!expanded) return el('div', { class: 'doc-card' }, head);

      const actions = el('div', { class: 'doc-actions' },
        el('button', { class: 'btn btn-outline', onClick: async () => { A.verifyStates = { ...A.verifyStates, [doc.id]: 'checking' }; render(); await verifyDocument(doc); } }, '🛡️ Verify integrity'),
        el('button', { class: 'btn btn-outline', onClick: () => downloadDocument(doc) }, '⬇️ Download + Watermark'),
        canShare ? el('button', { class: 'btn btn-outline', onClick: () => set({ showShareModal: doc.id }) }, '🔗 Create share link') : null,
        el('button', { class: 'btn btn-warn', onClick: () => simulateTamper(doc) }, '🧪 Simulate tampering (demo)')
      );

      // Active share links for this doc
      const shareTable = activeLinks.length ? el('div', { style: { marginTop: '10px' } },
        el('div', { class: 'muted small', style: { marginBottom: '4px' } }, `🔗 ${activeLinks.length} active share link${activeLinks.length !== 1 ? 's' : ''}:`),
        el('table', { class: 'share-links-table' },
          el('thead', {}, el('tr', {}, el('th', {}, 'Token'), el('th', {}, 'Expires'), el('th', {}, 'One-time'), el('th', {}, 'Action'))),
          el('tbody', {}, ...activeLinks.map(l => el('tr', {},
            el('td', { class: 'mono' }, l.token),
            el('td', {}, fmtDate(new Date(l.expiresAt).toISOString())),
            el('td', {}, 'Yes'),
            el('td', {}, el('button', { class: 'btn btn-danger', style: { padding: '3px 8px', fontSize: '11px' }, onClick: () => revokeShareLink(l.token) }, 'Revoke'))
          )))
        )
      ) : null;

      const versionsEl = doc.versions.length ? el('div', { class: 'versions' },
        el('div', { class: 'muted small', style: { marginBottom: '4px' } }, 'Version history'),
        ...doc.versions.map((v, i) => el('div', { class: 'version-row' }, el('span', { class: 'mono' }, shortHash(v.hash)), el('span', { class: 'muted small' }, `superseded ${fmtDate(v.at)} · ${v.by}`)))
      ) : null;

      return el('div', { class: 'doc-card' }, head,
        el('div', { class: 'doc-body' },
          el('div', { class: 'hash-row' },
            el('span', {}, '🔏'),
            el('span', { class: 'mono' }, shortHash(doc.hash)),
            el('span', { class: 'muted small' }, 'SHA-256 fingerprint · AES-256-GCM encrypted at rest')
          ),
          actions, shareTable, versionsEl,
          el('div', { class: 'muted small', style: { marginTop: '10px' } },
            `📋 ${A.auditLogs.filter(l => l.docId === doc.id).length} audit events for this document`)
        )
      );
    }

    /* ── Case detail ── */
    function buildCaseDetail() {
      const { cases, documents, auditLogs, user, selectedCaseId } = A;
      const nvCase = cases.find(c => c.id === selectedCaseId);
      if (!nvCase) return buildEmpty('Select a case from the dashboard.');
      const caseDocs = documents.filter(d => d.caseId === nvCase.id);
      const caseLogs = auditLogs.filter(l => l.caseId === nvCase.id);
      const canUpload = user.role === 'Investigating Officer' && !nvCase.sealed;
      const canSeal = user.role === 'Senior Officer' && !nvCase.sealed;
      return el('div', { class: 'page' },
        el('button', { class: 'back-btn', onClick: () => set({ screen: 'dashboard' }) }, '← All cases'),
        el('div', { class: 'page-head' },
          el('div', {},
            el('h2', {}, nvCase.title, nvCase.sealed ? el('span', { class: 'sealed-badge' }, '🔒 Sealed') : null),
            el('p', { class: 'muted', style: { marginTop: '4px' } }, `${nvCase.id} · ${nvCase.type} · opened ${fmtDate(nvCase.createdAt)} by ${nvCase.createdBy}`)
          ),
          el('div', { class: 'page-actions' },
            canUpload ? el('button', { class: 'btn btn-gold', onClick: () => set({ showUpload: true }) }, '⬆️ Upload document') : null,
            canSeal ? el('button', { class: 'btn btn-outline', onClick: () => sealCase(nvCase.id) }, '🔒 Seal case') : null,
            el('button', { class: 'btn btn-outline', onClick: () => exportCasePDF(nvCase) }, '📄 Export PDF')
          )
        ),
        nvCase.sealed ? el('div', { class: 'form-info' }, '🔒 This case is sealed. No further uploads or modifications are permitted. It is preserved for court submission.') : null,
        el('h3', { class: 'section-title' }, `Documents (${caseDocs.length})`),
        caseDocs.length === 0 ? buildEmpty('No documents yet.')
          : el('div', { class: 'doc-list' }, ...caseDocs.map(doc => buildDocRow(doc))),
        el('h3', { class: 'section-title' }, 'Chain of custody — this case'),
        buildAuditTable(caseLogs)
      );
    }

    /* ── Audit table ── */
    function buildAuditTable(logs) {
      if (!logs.length) return buildEmpty('No audit events yet.');
      const sorted = [...logs].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
      return el('div', { class: 'table' },
        el('div', { class: 'table-head' }, el('span', {}, 'Action'), el('span', {}, 'User'), el('span', {}, 'Timestamp'), el('span', {}, 'Entry hash')),
        ...sorted.map(l => el('div', { class: `table-row${l.action === 'TAMPER_ALERT' ? ' row-alert' : ''}` },
          el('span', {}, (l.action === 'TAMPER_ALERT' ? '⚠️ ' : '') + (ACTION_LABEL[l.action] || l.action)),
          el('span', {}, l.user), el('span', { class: 'muted small' }, fmtDate(l.timestamp)), el('span', { class: 'mono small' }, shortHash(l.entryHash))
        ))
      );
    }

    function buildGlobalAudit() {
      return el('div', { class: 'page' },
        el('div', { class: 'page-head' }, el('div', {}, el('h2', {}, 'Global Chain of Custody'), el('p', { class: 'muted', style: { marginTop: '4px' } }, 'Every action across every case — append-only, hash-linked.'))),
        buildAuditTable(A.auditLogs)
      );
    }

    function buildAlertsPanel() {
      const alerts = A.auditLogs.filter(l => l.action === 'TAMPER_ALERT').sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
      return el('div', { class: 'page' },
        el('div', { class: 'page-head' }, el('div', {}, el('h2', {}, 'Security Alerts'), el('p', { class: 'muted', style: { marginTop: '4px' } }, 'Hash mismatches detected during integrity checks.'))),
        alerts.length === 0
          ? el('div', { class: 'empty ok' }, el('span', { style: { fontSize: '22px' } }, '🛡️'), el('p', {}, 'No tampering detected. All fingerprints match.'))
          : el('div', { class: 'doc-list' }, ...alerts.map(a => {
            const doc = A.documents.find(d => d.id === a.docId);
            const c = A.cases.find(cc => cc.id === a.caseId);
            return el('div', { class: 'alert-card' }, el('span', { style: { fontSize: '18px' } }, '⚠️'),
              el('div', {}, el('div', {}, el('strong', {}, doc ? doc.name : 'Unknown'), ' in ' + (c ? c.title : a.caseId)),
                el('div', { class: 'muted small' }, `Detected ${fmtDate(a.timestamp)} during check by ${a.user}`)
              ));
          }))
      );
    }

    function buildSearch() {
      const q = A.searchQuery.toLowerCase();
      const mc = A.cases.filter(c => c.title.toLowerCase().includes(q) || c.id.toLowerCase().includes(q) || c.type.toLowerCase().includes(q));
      const md = A.documents.filter(d => d.name.toLowerCase().includes(q) || d.docType.toLowerCase().includes(q));
      return el('div', { class: 'page' },
        el('h2', {}, `Search results for "${A.searchQuery}"`),
        el('h3', { class: 'section-title' }, `Cases (${mc.length})`),
        ...mc.map(c => el('button', { class: 'case-row', onClick: () => set({ selectedCaseId: c.id, screen: 'case', searchQuery: '' }) },
          el('div', { class: 'case-icon' }, '🗂️'), el('div', { class: 'case-info' }, el('div', { class: 'case-title' }, c.title), el('div', { class: 'muted small' }, `${c.id} · ${c.type}`)), el('span', { class: 'chevron' }, '›')
        )),
        el('h3', { class: 'section-title' }, `Documents (${md.length})`),
        ...md.map(d => el('button', { class: 'case-row', onClick: () => set({ selectedCaseId: d.caseId, screen: 'case', searchQuery: '' }) },
          el('div', { class: 'case-icon' }, '📄'), el('div', { class: 'case-info' }, el('div', { class: 'case-title' }, d.name), el('div', { class: 'muted small' }, `${d.docType} · ${d.caseId}`)), el('span', { class: 'chevron' }, '›')
        )),
        mc.length === 0 && md.length === 0 ? buildEmpty('No matches found.') : null
      );
    }

    /* ── Modals ── */
    function modalShell(title, onClose, content) {
      return el('div', { class: 'modal-backdrop', onClick: onClose },
        el('div', { class: 'modal', onClick: e => e.stopPropagation() },
          el('div', { class: 'modal-head' }, el('h3', {}, title), el('button', { class: 'icon-btn', onClick: onClose }, '✕')),
          content
        )
      );
    }

    function buildNewCaseModal() {
      const ti = el('input', { value: A.newCaseTitle, placeholder: 'e.g. State vs. Unknown — Sector 8 Fraud', id: 'new-case-title' });
      // No render() on keystroke — just track state; button enabled/disabled updated directly
      ti.addEventListener('input', e => {
        A.newCaseTitle = e.target.value;
        const btn = document.getElementById('new-case-btn');
        if (btn) btn.disabled = !A.newCaseTitle.trim();
      });
      const ts = el('select', { onChange: e => { A.newCaseType = e.target.value; } },
        ...CASE_TYPES.map(t => { const o = el('option', { value: t }, t); if (t === A.newCaseType) o.selected = true; return o; })
      );
      return modalShell('Open a new case', () => set({ showNewCase: false }),
        el('div', { class: 'form' }, el('label', {}, 'Case title', ti), el('label', {}, 'Case type', ts),
          el('button', { class: 'btn btn-gold', disabled: !A.newCaseTitle.trim(), id: 'new-case-btn', onClick: () => createCase(A.newCaseTitle.trim(), A.newCaseType) }, '➕ Create secure workspace')
        )
      );
    }

    function buildUploadModal() {
      const fi = el('input', { type: 'file', onChange: e => { const f = e.target.files[0]; if (f) set({ uploadFile: f, uploadDocType: guessDocType(f.name), uploadError: '' }); } });
      const ds = A.uploadFile ? el('select', { onChange: e => { A.uploadDocType = e.target.value; } },
        ...DOC_TYPES.map(t => { const o = el('option', { value: t }, t); if (t === A.uploadDocType) o.selected = true; return o; })
      ) : null;
      return modalShell('Upload document', () => set({ showUpload: false, uploadFile: null, uploadError: '' }),
        el('div', { class: 'form' },
          el('label', {}, 'Select file (max 50MB, no executables)', fi),
          A.uploadFile ? el('div', { class: 'muted small' }, `${(A.uploadFile.size / 1024).toFixed(1)} KB · Will be AES-256 encrypted & SHA-256 fingerprinted`) : null,
          A.uploadFile ? el('label', {}, 'Document type', ds) : null,
          A.uploadError ? el('div', { class: 'form-error' }, A.uploadError) : null,
          el('button', {
            class: 'btn btn-gold', disabled: !A.uploadFile || A.uploadBusy, onClick: async () => {
              if (!A.uploadFile) return;
              set({ uploadBusy: true });
              await uploadDocument(A.selectedCaseId, A.uploadFile, A.uploadDocType);

        )
      );

    function buildShareModal() {
      const docId = A.showShareModal;

      const opts = el('div', { class: 'expiry-opts' },
        ...EXPIRY_OPTIONS.map((o, i) => el('button', { class: `expiry-opt${A.shareExpiryIdx === i ? ' selected' : ''}`, onClick: () => set({ shareExpiryIdx: i }) }, o.label))
      );

        el('div', { class: 'form' },

          el('label', {}, 'Link expiry', opts),
          el('button', {
            class: 'btn btn-gold', onClick: async () => {
              const token = await createShareLink(doc, EXPIRY_OPTIONS[A.shareExpiryIdx].ms);
              notify('success', `Share link created: ${token} — expires in ${EXPIRY_OPTIONS[A.shareExpiryIdx].label}`);
              set({ showShareModal: null });
            }
          }, '🔗 Generate share link')
        )
      );

    function buildRedeemModal() {
      const ti = el('input', { value: A.redeemToken, placeholder: 'e.g. 8F3KQ1ZP', style: { textTransform: 'uppercase' }, id: 'redeem-input' });
      // No render() on keystroke — update button directly
      ti.addEventListener('input', e => {
        A.redeemToken = e.target.value;
        const btn = document.getElementById('redeem-btn');
        if (btn) btn.disabled = !A.redeemToken.trim();
      });
      return modalShell('Redeem a share code', () => set({ showRedeem: false, redeemToken: '', redeemResult: null }),
        el('div', { class: 'form' },
          el('label', {}, 'Share code', ti),
          el('button', {
            class: 'btn btn-gold', disabled: !A.redeemToken.trim(), id: 'redeem-btn', onClick: async () => {
              const r = await redeemShareToken(A.redeemToken);

            }
          }, 'Access document'),
          A.redeemResult && !A.redeemResult.ok ? el('div', { class: 'form-error' }, A.redeemResult.msg) : null,
          A.redeemResult && A.redeemResult.ok ? el('div', { class: 'share-success' },
            el('span', { class: 'green', style: { fontSize: '16px' } }, '✅'),
            el('div', {}, el('strong', {}, A.redeemResult.doc.name), el('div', { class: 'muted small' }, `${A.redeemResult.doc.docType} · fingerprint ${shortHash(A.redeemResult.doc.hash)}`))
          ) : null
        )
      );

    /* ── Step-up Auth Modal ── */
    function buildStepUpModal() {
      const step = A.stepUpStep;
      const fp = A.stepUpFpState;

      // Step indicators
      const dots = el('div', { class: 'step-indicator' },
        el('div', { class: `step-dot ${step === 1 ? 'active' : step > 1 ? 'done' : ''}` }, step > 1 ? '✓' : '1'),
        el('div', { class: `step-dot ${step === 2 ? 'active' : fp === 'success' ? 'done' : ''}` }, fp === 'success' ? '✓' : '2')
      );

      let body;

      /* ── Step 1: Password ── */
      if (step === 1) {
        const pwInput = el('input', { type: 'password', placeholder: 'Enter your password', id: 'stepup-pw', style: { textAlign: 'center' } });
        pwInput.addEventListener('input', e => {
          A.stepUpPassword = e.target.value;
          const btn = document.getElementById('stepup-pw-btn');
          if (btn) btn.disabled = !A.stepUpPassword.trim();
        });
        body = el('div', { class: 'form' },
          el('div', { class: 'form-info' }, '🔐 Re-enter your password to confirm your identity before creating a new case.'),
          el('label', {}, 'Password', pwInput),
          A.stepUpError ? el('div', { class: 'form-error' }, A.stepUpError) : null,
          el('button', {
            class: 'btn btn-gold', style: { width: '100%' }, disabled: true, id: 'stepup-pw-btn',
            onClick: stepUpVerifyPassword
          }, '→ Continue to fingerprint')
        );
      }

      /* ── Step 2: Fingerprint ── */
      else {
        const fpLabels = {
          idle: { text: 'Tap the fingerprint to scan', color: '#6B6759' },
          scanning: { text: 'Scanning… hold still', color: '#A9822E' },
          success: { text: 'Fingerprint verified ✓', color: '#2F7D4F' },
          fail: { text: 'Verification failed. Retry.', color: '#B3261E' },
        };
        const lbl = fpLabels[fp] || fpLabels.idle;

        const ring = el('div', {
          class: `fp-ring${fp === 'idle' ? '' : ' ' + fp}`,
          onClick: fp === 'idle' || fp === 'fail' ? stepUpVerifyFingerprint : null,
          style: { cursor: fp === 'scanning' ? 'not-allowed' : 'pointer' }
        },
          fp === 'scanning' ? el('div', { class: 'fp-scan-bar' }) : null,
          el('span', { class: 'fp-icon' },
            fp === 'success' ? '✅' : fp === 'fail' ? '❌' : '👆'
          )
        );

        body = el('div', { class: 'form' },
          el('div', { class: 'fp-wrap' },
            el('div', { class: 'muted small', style: { textAlign: 'center' } }, 'Step 2 of 2 — Biometric Verification'),
            ring,
            el('div', { class: 'fp-label', style: { color: lbl.color } }, lbl.text)
          ),
          A.stepUpError ? el('div', { class: 'form-error' }, A.stepUpError) : null,
          fp === 'idle' || fp === 'fail'
            ? el('button', { class: 'btn btn-gold', style: { width: '100%' }, onClick: stepUpVerifyFingerprint }, '👆 Verify Fingerprint')
            : null
        );
      }

      return modalShell('🔐 Step-Up Verification Required', cancelStepUp,
        el('div', {},
          dots,
          el('p', { class: 'muted small', style: { textAlign: 'center', marginBottom: '14px' } },
            'For security, creating a new case requires re-verification.'
          ),
          body
        )
      );
    }

    function buildEmpty(text) {
      return el('div', { class: 'empty' }, el('span', { style: { fontSize: '22px' } }, '🗂️'), el('p', {}, text));
    }

    function buildToast() {
      if (!A.toast) return null;
      const icon = A.toast.type === 'success' ? '✅' : A.toast.type === 'error' ? '⚠️' : '🧪';
      return el('div', { class: `toast${A.toast.type === 'error' ? ' error' : A.toast.type === 'warn' ? ' warn' : ''}` }, el('span', {}, icon), el('span', {}, A.toast.msg));
    }

    /* =====================================================================
       Main Render
       ===================================================================== */
    function render() {
      const root = document.getElementById('root');
      root.innerHTML = '';

      // Session warning overlay (highest priority)
      if (A.sessionShowWarn) root.appendChild(buildSessionWarn());

      if (!A.user && !A.awaitingMFA) {
        root.appendChild(buildLogin());
        if (A.showRedeem) root.appendChild(buildRedeemModal());
        const t = buildToast(); if (t) root.appendChild(t);
        return;
      }

      if (!A.user && A.awaitingMFA) {
        root.appendChild(buildMFA());
        const t = buildToast(); if (t) root.appendChild(t);
        return;
      }

      let mainContent;
      if (A.searchQuery.trim()) mainContent = buildSearch();
      else if (A.screen === 'dashboard') mainContent = buildDashboard();
      else if (A.screen === 'audit') mainContent = buildGlobalAudit();
      else if (A.screen === 'alerts') mainContent = buildAlertsPanel();
      else if (A.screen === 'case' && A.selectedCaseId) mainContent = buildCaseDetail();
      else mainContent = buildEmpty('Select a case from the dashboard to continue.');

      const mainEl = el('div', { class: 'main' }, buildTopBar(), el('div', { id: 'main-content-area' }, mainContent));
      root.appendChild(el('div', { class: 'layout' }, buildSidebar(), mainEl));

      if (A.showNewCase) root.appendChild(buildNewCaseModal());
      if (A.showStepUp) root.appendChild(buildStepUpModal());
      if (A.showUpload && A.selectedCaseId) root.appendChild(buildUploadModal());
      if (A.showShareModal) root.appendChild(buildShareModal());
      if (A.showRedeem) root.appendChild(buildRedeemModal());
      const t = buildToast(); if (t) root.appendChild(t);
    }

    /* ── Boot ── */
    seedData().then(() => render());
  </script>
</body>

</html>
